<!DOCTYPE html>
<html>
<head>
<title>More Memories</title>

<style>
body{
    margin:0;
    padding:25px 15px;
    background:#F8F5F0;
    font-family:Georgia,serif;
    text-align:center;
}

.card{
    background:#E9DFD2;
    padding:25px;
    border-radius:25px;
    max-width:380px;
    margin:auto;
    box-shadow:0 10px 20px rgba(0,0,0,.15);
}

h1{
    color:#7A5C58;
}

.intro{
    color:#6E5A54;
    font-size:17px;
    line-height:1.6;
}

.photo{
    background:#FFFDF9;
    padding:12px;
    margin:25px 0;
    box-shadow:0 5px 12px rgba(0,0,0,.15);
}

.photo img{
    width:100%;
    display:block;
    border-radius:5px;
}

.caption{
    color:#7A5C58;
    margin-top:10px;
    font-size:16px;
}

button{
    margin-top:20px;
    padding:12px 25px;
    border:none;
    background:#7A5C58;
    color:white;
    border-radius:25px;
    font-size:16px;
}
</style>
</head>

<body>

<div class="card">

<h1>🖼️ More Memories</h1>

<p class="intro">
A few more little moments that are worth keeping forever. 🤍
</p>

<div class="photo">
    <img src="photo1.jpg" alt="Memory">
    <div class="caption">A moment worth remembering 🤍</div>
</div>

<div class="photo">
    <img src="photo2.jpg" alt="Memory">
    <div class="caption">Another little memory 🌸</div>
</div>

<div class="photo">
    <img src="photo3.jpg" alt="Memory">
    <div class="caption">And many more to come ✨</div>
</div>

<button onclick="window.location.href='final.html'">
One Last Thing 🤍
</button>

</div>

</body>
</html>
