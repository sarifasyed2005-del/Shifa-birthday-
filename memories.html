<!DOCTYPE html>
<html>
<head>
<title>Our Memories</title>

<style>
body{
margin:0;
padding:25px 15px;
background:#F8F5F0;
font-family:Georgia, serif;
text-align:center;
}

.card{
background:#E9DFD2;
padding:25px;
border-radius:20px;
max-width:380px;
margin:auto;
box-shadow:0 10px 20px rgba(0,0,0,.15);
}

h1{
color:#7A5C58;
}

p{
color:#6E5A54;
font-size:17px;
}

.memory{
background:#FFFDF9;
padding:12px;
margin:20px 0;
box-shadow:0 5px 12px rgba(0,0,0,.15);
transform:rotate(-2deg);
}

.memory:nth-child(2){
transform:rotate(2deg);
}

.memory:nth-child(3){
transform:rotate(-1deg);
}

.memory img{
width:100%;
border-radius:5px;
display:block;
}

.caption{
margin-top:10px;
color:#7A5C58;
font-size:16px;
}

button{
margin-top:20px;
padding:12px 25px;
border:none;
background:#7A5C58;
color:white;
border-radius:25px;
font-size:16px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="card">

<h1>📸 Our Little Memories</h1>

<p>
A few moments that became beautiful memories. 🤍
</p>

<div class="memory">
<img src="photo1.jpg" alt="Memory 1">
<div class="caption">One of our little moments 🤍</div>
</div>

<div class="memory">
<img src="Snapchat-1472595139.jpg" alt="Memory 2">
<div class="caption">More memories, more laughter 🌸</div>
</div>

<div class="memory">
<img src="photo3.jpg" alt="Memory 3">
<div class="caption">And many more to come ✨</div>
</div>

<button onclick="window.location.href='letter.html'">
Read Your Letter 💌
</button>

</div>

</body>
</html>
