<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Shifa 🤍</title>

<style>
body{
margin:0;
padding:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#F8F5F0;
font-family:Georgia, serif;
overflow:hidden;
}

.card{
background:#E9DFD2;
padding:30px;
border-radius:25px;
text-align:center;
width:85%;
max-width:350px;
box-shadow:0 10px 25px rgba(0,0,0,.15);
}

h1{
color:#7A5C58;
}

p{
color:#6a554f;
font-size:18px;
}

button{
margin-top:20px;
padding:14px 28px;
border:none;
border-radius:30px;
background:#7A5C58;
color:white;
font-size:18px;
cursor:pointer;
}

.panda{
font-size:80px;
animation:bounce 2s infinite;
}

@keyframes bounce{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-10px);}
}
</style>

</head>

<body>

<div class="card">
<div class="panda">🐼</div>

<h1>Hey, Shifa! 🤍</h1>

<p>A little surprise is waiting for you...</p>

<button onclick="alert('Next we'll make the password page!')">
Open ✨
</button>

</div>

</body>
</html>
