<!DOCTYPE html>
<html>
<head>
<title>A Little Surprise For Shifa</title>

<style>
body{
margin:0;
padding:0;
background:#F8F5F0;
font-family:Georgia, serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:#E9DFD2;
padding:35px;
border-radius:25px;
width:320px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

.panda{
font-size:80px;
animation:bounce 2s infinite;
}

@keyframes bounce{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-12px);}
}

h1{
color:#7A5C58;
}

p{
color:#6E5A54;
font-size:18px;
}

button{
background:#7A5C58;
color:white;
padding:12px 28px;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
margin-top:20px;
}

button:hover{
background:#5d433f;
}
</style>

</head>

<body>

<div class="card">

<div class="panda">🐼</div>

<h1>Hey, Shifa! 🤍</h1>

<p>
Someone made a little surprise just for you...
</p>

<button onclick="window.location.href='password.html'">
Open ✨
</button>

</div>

</body>
</html>
