<!DOCTYPE html>
<html>
<head>
<title>Password</title>
<style>
body{
margin:0;
padding:0;
background:#F8F5F0;
font-family:Georgia, serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:#E9DFD2;
padding:35px;
border-radius:25px;
width:320px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,.15);
}

h2{
color:#7A5C58;
}

input{
width:80%;
padding:12px;
border-radius:12px;
border:1px solid #B89E8A;
font-size:18px;
margin-top:15px;
}

button{
margin-top:20px;
padding:12px 28px;
background:#7A5C58;
color:white;
border:none;
border-radius:25px;
font-size:18px;
cursor:pointer;
}
</style>

<script>
function checkPassword(){
let pass=document.getElementById("pass").value;

if(pass=="2408"){
window.location.href="birthday.html";
}
else{
alert("Oops! Wrong password 🐼");
}
}
</script>

</head>

<body>

<div class="card">

<h2>🔒 Secret Password</h2>

<p>Enter the password to continue</p>

<input type="password" id="pass" placeholder="Password">

<br>

<button onclick="checkPassword()">
Continue
</button>

</div>

</body>
</html>
